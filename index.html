<style>
/* Layout: una columna tipo libro de actas de asamblea; de día hoja rayada, de noche pizarrón. Sin fuentes externas para que funcione sin conexión. */
:root{
  --papel:#f9fbfb; --renglon:#d9e7e8; --margen:#2b7a83;
  --tinta:#18272a; --tinta-suave:#55696d; --acento:#1d6670;
  --firme:#2f8a57; --fragil:#c98a12; --falta:#c4453b;
  --firme-bg:#e3f2ea; --fragil-bg:#fbf0d8; --falta-bg:#f9e1de;
  --tarjeta:#ffffff; --borde:#cadcde; --cita:#3b2f6b; --cita-bg:#efedf7; --barra:#1d6670; --barra-bg:#ddecee;
  --f-titulo:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-cuerpo:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#172022; --renglon:#22302f; --margen:#2f6f76;
  --tinta:#e9f2f2; --tinta-suave:#a3b8ba; --acento:#7fd0d9;
  --firme:#6fcf97; --fragil:#f2c15b; --falta:#ff8a7e;
  --firme-bg:#24382d; --fragil-bg:#3b3422; --falta-bg:#402a27;
  --tarjeta:#1f2b2d; --borde:#34474a; --cita:#c9c0ff; --cita-bg:#2a2638; --barra:#7fd0d9; --barra-bg:#263a3d; color-scheme:dark }}
:root[data-theme="dark"]{
  --papel:#172022; --renglon:#22302f; --margen:#2f6f76;
  --tinta:#e9f2f2; --tinta-suave:#a3b8ba; --acento:#7fd0d9;
  --firme:#6fcf97; --fragil:#f2c15b; --falta:#ff8a7e;
  --firme-bg:#24382d; --fragil-bg:#3b3422; --falta-bg:#402a27;
  --tarjeta:#1f2b2d; --borde:#34474a; --cita:#c9c0ff; --cita-bg:#2a2638; --barra:#7fd0d9; --barra-bg:#263a3d; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-cuerpo);font-size:16px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--renglon) 31px,var(--renglon) 32px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.hoja{max-width:640px;margin:0 auto;position:relative;padding-left:22px}
.hoja::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--margen);opacity:.7}
h1,h2,h3{font-family:var(--f-titulo);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2rem;color:var(--acento)}
h2{font-size:1.4rem}
h3{font-size:1.05rem}
p{margin:0}
.pila{display:flex;flex-direction:column;gap:16px}
.chico{font-size:.875rem;color:var(--tinta-suave)}
.etq{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--tinta-suave)}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer}
.btn{border:2px solid var(--acento);background:var(--acento);color:var(--papel);border-radius:999px;padding:10px 20px;font-weight:700}
.btn.sec{background:transparent;color:var(--acento)}
.btn.peligro{border-color:var(--falta);background:transparent;color:var(--falta)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--fragil);outline-offset:2px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.entre{justify-content:space-between}
input[type=text],input[type=number]{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--borde);border-radius:8px;background:var(--tarjeta);color:var(--tinta)}
input[type=number]{max-width:120px;font-variant-numeric:tabular-nums}
.num{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.num label{min-width:0}
.ops{display:flex;flex-direction:column;gap:8px}
.op{text-align:left;border:2px solid var(--borde);background:var(--tarjeta);color:var(--tinta);border-radius:10px;padding:12px 14px}
.op[aria-pressed="true"]{border-color:var(--acento);box-shadow:inset 4px 0 0 var(--acento);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--borde);background:var(--tarjeta);color:var(--tinta);border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{border-color:var(--acento);background:var(--acento);color:var(--papel)}
.pasos{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.paso{border:2px solid var(--borde);background:var(--tarjeta);color:var(--tinta-suave);border-radius:6px;padding:4px 0;font-size:.75rem;font-weight:700;text-align:center;min-width:0;overflow:hidden}
.paso.hecho{border-color:var(--acento);color:var(--acento)}
.paso.ahora{background:var(--acento);border-color:var(--acento);color:var(--papel)}
.estado{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.e-firme{background:var(--firme-bg);color:var(--firme)}
.e-fragil{background:var(--fragil-bg);color:var(--fragil)}
.e-falta{background:var(--falta-bg);color:var(--falta)}
.hallazgo{border-left:4px solid var(--falta);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.hallazgo.fragil{border-left-color:var(--fragil)}
.hallazgo .preg{font-style:italic;color:var(--acento)}
.diagrama{overflow-x:auto}
.diagrama svg{display:block;max-width:100%;height:auto;margin:0 auto}
.lista{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lista li{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:.9rem;align-items:center}
.embudo{display:flex;flex-direction:column;gap:8px}
.eb-fila{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3em;gap:10px;align-items:center;font-size:.875rem}
.eb-barra{background:var(--barra-bg);border-radius:4px;height:26px;position:relative;overflow:hidden}
.eb-barra span{display:block;height:100%;background:var(--barra);border-radius:4px;min-width:2px}
.eb-num{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.eb-pct{font-size:.75rem;color:var(--tinta-suave);font-variant-numeric:tabular-nums}
.ejemplo{background:var(--fragil-bg);color:var(--fragil);border-radius:4px;padding:1px 6px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
details.guia-paso summary{cursor:pointer;font-weight:700;color:var(--acento)}
details.guia-paso[open] summary{margin-bottom:4px}
.serbia{font-size:.875rem;color:var(--cita);background:var(--cita-bg);border-radius:6px;padding:6px 10px}
.e-serbia{background:var(--cita-bg);color:var(--cita)}
.aviso{font-size:.875rem;color:var(--tinta-suave);border-top:1px dashed var(--borde);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.op,.chip,.btn{transition:border-color .15s,background .15s}}
</style>

</head>

function hoy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

  var r=d.r,n=d.n||{},h=[];
  function H(g,t,x,s,p){h.push({g:g,t:t,x:x,s:s,p:p})}
  var queda=ratio(n.vienen,n.inicio), voz=ratio(n.hablaron,n.vienen), rol=ratio(n.roles,n.vienen);
  if(queda!=null&&queda<0.4)H("falta","La asamblea se vació desde el inicio.","De "+n.inicio+" al principio, hoy vienen "+n.vienen+".","En Serbia la participación pasó de la euforia al agotamiento y quedó un núcleo duro, sin factor de corrección.","¿Qué haría falta para que vuelvan quienes dejaron de venir?");
  if(voz!=null&&voz<0.25)H("falta","Hablan siempre los mismos.","De "+n.vienen+" que vienen, "+n.hablaron+" hablaron en la última asamblea.","En Serbia la deliberación solo oral favoreció a quienes ya sabían hablar en público.","¿Qué forma de participar sin tomar la palabra larga pueden sumar (señas, ronda breve, propuestas por escrito)?");
  if((rol!=null&&rol<0.15)||r.s2c===0)H(r.s2c===0?"falta":"fragil","Los roles circulan entre pocos.",(n.roles!=null?n.roles+" personas ocuparon un rol en el último mes. ":"")+"La rotación existe en el papel, pero no reparte la experiencia.","En Serbia la moderación rotaba por reglamento y aun así quedó en un círculo chico, porque pocos aceptaban el rol.","¿Quién nuevo puede moderar o llevar el acta en la próxima asamblea, acompañado por alguien con experiencia?");
  if(r.s2a===1||r.s5d===1||r.s5d===0)H(r.s5d===0?"falta":"fragil","Las decisiones llegan cocinadas.","El orden del día o las decisiones se arman fuera de la asamblea.","En Serbia las reuniones de coordinación nocturnas vaciaron el pleno: decidían y después comunicaban.","¿Cómo se arma el orden del día de la próxima asamblea, y quién puede proponer puntos?");
  if(r.s2b===0)H("fragil","Nadie cuida los tiempos.","Sin tiempos por punto y por intervención, la asamblea se alarga y se van primero quienes tienen menos tiempo.","En Serbia un segundo moderador se ocupaba solo de tiempos y turnos; las intervenciones duraban entre 1 y 3 minutos.","¿Quién cuida los tiempos en la próxima asamblea, y con qué límite?");
  if(r.s2d===0)H("fragil","No hay forma corta de disentir.","Para marcar un desacuerdo o corregir un dato hay que pedir una intervención larga.","En Serbia las señas mostraban acuerdo y desacuerdo sin interrumpir, y la objeción técnica corregía un dato sin abrir el debate.","¿Qué seña o regla pueden adoptar para disentir o corregir sin pedir la palabra?");
  if(r.s2e===0)H("falta","El ritmo los está agotando.","Una asamblea que agota a sus participantes pierde primero a quienes tienen menos tiempo.","En Serbia los plenos diarios se abandonaron, y los autores señalan la falta de mecanismos de relevo como la debilidad principal.","¿Qué ritmo pueden sostener tres meses más, y qué se delega a grupos?");
  if(r.s3a===0)H("falta","Participar cuesta y expulsa.","Solo siguen quienes pueden pagar los costos de participar.","En Serbia el costo del alojamiento sacó del bloqueo a quienes no podían pagarlo y cambió la composición del pleno.","¿Qué fondo o red puede cubrir el costo más pesado?");
  if(r.s3b!=null&&r.s3b<2)H(r.s3b===0?"falta":"fragil","Los mismos ponen el cuerpo.","La exposición no rota o no tiene respaldo.","En Serbia el servicio de orden concentró los golpes; abogados, salud y vecinos armaron una red de apoyo gratuita.","¿Con qué abogado, médico o psicóloga pueden contar, y cómo rota la exposición?");
  if(r.s3c===0)H("falta","Lo que es de todos no lo hace nadie.","Las tareas colectivas quedan sin responsable.","En Serbia se documentó el mismo efecto: la responsabilidad colectiva se volvió de nadie en las decisiones que pedían participación masiva.","¿Qué tarea de todos necesita un responsable con nombre de rol esta semana?");
  if(nivel(d,sec("s3e"))!=="firme")H(nivel(d,sec("s3e")),"La asamblea no se corrige.","Faltan actas aprobadas, revisión de decisiones o evaluación después de las acciones.","En Serbia el acta se aprobaba al inicio del pleno siguiente, toda decisión era revisable y cada acción grande se evaluaba en colectivo.","¿Quién lleva el acta, y en qué momento de la próxima asamblea se revisa?");
  if(r.s3ed===0)H("fragil","Se vota sin información.","Se decide aunque varias personas digan que falta información.","En Serbia regía una regla práctica: si varios dicen que falta información, todavía no se vota.","¿Pueden adoptar esa regla en la próxima asamblea?");
  if(r.s4c===0)H("falta","Cámara de eco.","Hablar con quienes piensan distinto se vive como traición.","En Serbia la distancia frente a los partidos pasó de táctica a norma de exclusión y silenció a quienes querían dialogar.","¿Con quién de afuera podrían conversar sin perder autonomía, y quién lo decide?");
  if(r.s5b===0)H("falta","La asamblea tiene dueño de la voz.","Una o dos personas hablan siempre por todos.","En Serbia cada estudiante podía hablar en público una sola vez: la lección de los noventa fue que los representantes terminaron cooptados.","¿Quién habla en nombre de la asamblea la próxima vez, y cuándo rota?");
  if(r.s5c!=null&&r.s5c<2)H(r.s5c===0?"falta":"fragil","El disenso se va.","Quien está en desacuerdo calla o deja de venir.","En Serbia la acusación de sabotaje se usó contra quien proponía otra estrategia; los disidentes se retiraron y el pleno perdió oposición interna.","¿Cómo puede alguien proponer otra estrategia sin quedar marcado?");
  if(r.s1b===0)H("fragil","Los grupos no informan.","Lo que hacen los grupos de trabajo no vuelve a la asamblea.","En Serbia cada grupo cerraba el ciclo con un informe obligatorio al pleno.","¿En qué momento de la asamblea informa cada grupo?");
  return h;
}

function color(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function diagrama(d){
  var C={tinta:color("--tinta"),suave:color("--tinta-suave"),tarjeta:color("--tarjeta"),borde:color("--borde"),papel:color("--papel")};
  function fill(n){return color("--"+n+"-bg")} function stroke(n){return color("--"+n)}
  var n={};SECS_VSM().forEach(function(s){n[s.id]=nivel(d,s)});
  var acts=((d.m&&d.m.acts&&d.m.acts.length)?d.m.acts:["Intervención"]).slice(0,8);
  var off=58, filas=Math.ceil(acts.length/2), h1=filas*64+40, H=off+250+h1+20, W=360;
  var o=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" font-family="system-ui,sans-serif" role="img" aria-label="Mapa de la asamblea">'];
  o.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+C.papel+'"/>');
  function caja(x,y,w,h,id,cod,txt){
    o.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" fill="'+fill(n[id])+'" stroke="'+stroke(n[id])+'" stroke-width="2"/>');
    o.push('<text x="'+(x+10)+'" y="'+(y+20)+'" font-size="12" font-weight="700" fill="'+stroke(n[id])+'">'+cod+' · '+NOMBRE_NIVEL[n[id]].toUpperCase()+'</text>');
    o.push('<text x="'+(x+10)+'" y="'+(y+38)+'" font-size="14" fill="'+C.tinta+'">'+esc(txt)+'</text>');
  }
  o.push('<text x="10" y="18" font-size="15" font-weight="700" fill="'+C.tinta+'">'+esc(d.org)+'</text>');
  o.push('<text x="'+(W-10)+'" y="18" font-size="12" text-anchor="end" fill="'+C.suave+'">'+fechaLinda(d.fecha)+'</text>');
  // Nivel superior (recursividad)
  o.push('<rect x="60" y="30" width="290" height="34" rx="8" fill="none" stroke="'+C.suave+'" stroke-width="1.5" stroke-dasharray="5 4"/>');
  o.push('<text x="70" y="52" font-size="12" fill="'+C.suave+'">'+esc(TXT.sup(d))+'</text>');
  o.push('<line x1="205" y1="64" x2="205" y2="'+(30+off)+'" stroke="'+stroke(n.s5)+'" stroke-width="2"/>');
  caja(60,30+off,290,50,"s5","S5","Quiénes somos");
  caja(60,92+off,290,50,"s4","S4","Afuera y lo que viene");
  caja(60,154+off,180,50,"s3","S3",TXT.s3);
  caja(246,154+off,104,50,"s3e","S3*","Verificación");
  var y2=216+off, bandaH=y2+h1-(30+off), bandaY=30+off;
  o.push('<rect x="10" y="'+bandaY+'" width="40" height="'+bandaH+'" rx="8" fill="'+fill(n.s2)+'" stroke="'+stroke(n.s2)+'" stroke-width="2"/>');
  var cy0=bandaY+bandaH/2;
  o.push('<text x="30" y="'+cy0+'" font-size="12" font-weight="700" fill="'+stroke(n.s2)+'" text-anchor="middle" transform="rotate(-90 30 '+cy0+')">S2 · '+TXT.s2+' · '+NOMBRE_NIVEL[n.s2].toUpperCase()+'</text>');
  o.push('<rect x="60" y="'+y2+'" width="290" height="'+h1+'" rx="8" fill="'+C.tarjeta+'" stroke="'+stroke(n.s1)+'" stroke-width="2"/>');
  o.push('<text x="70" y="'+(y2+20)+'" font-size="12" font-weight="700" fill="'+stroke(n.s1)+'">S1 · LO QUE HACE · '+NOMBRE_NIVEL[n.s1].toUpperCase()+'</text>');
  acts.forEach(function(a,i){
    var cx=70+(i%2)*140, cy=y2+32+Math.floor(i/2)*64;
    o.push('<rect x="'+cx+'" y="'+cy+'" width="130" height="52" rx="26" fill="'+fill(n.s1)+'" stroke="'+stroke(n.s1)+'" stroke-width="1.5"/>');
    var pal=a.split(" "), l1="", l2="";
    pal.forEach(function(w){if((l1+" "+w).trim().length<=16&&!l2)l1=(l1+" "+w).trim();else l2=(l2+" "+w).trim()});
    o.push('<text x="'+(cx+65)+'" y="'+(cy+(l2?22:31))+'" font-size="12" text-anchor="middle" fill="'+C.tinta+'">'+esc(l1)+'</text>');
    if(l2)o.push('<text x="'+(cx+65)+'" y="'+(cy+38)+'" font-size="12" text-anchor="middle" fill="'+C.tinta+'">'+esc(l2.slice(0,18))+'</text>');
  });
  o.push('</svg>');return o.join("");
}

function embudo(d){
  var n=d.n||{}, max=Math.max.apply(null,[1].concat(NUMS.map(function(x){return +n[x.id]||0})));
  return '<div class="embudo">'+NUMS.map(function(x,i){
    var v=n[x.id]||0, b=EMB_BASE[i], base=b!=null?n[NUMS[b].id]:null, pct=(base>0)?Math.round(100*v/base)+"% de "+NUM_REF[NUMS[b].id]:"";
    return '<div class="eb-fila"><span>'+NUM_CORTO[x.id]+'<br><span class="eb-pct">'+pct+'</span></span><div class="eb-barra"><span style="width:'+(100*v/max)+'%"></span></div><span class="eb-num">'+v+'</span></div>';
  }).join("")+'</div>';
}

function resumenTexto(d){
  var n=d.n||{};
  var t=[TXT.herr+": "+d.org+(d.zona?" ("+d.zona+")":"")+", "+fechaLinda(d.fecha),"",
    "Gente: "+NUMS.map(function(x){return NUM_CORTO[x.id].toLowerCase()+" "+(n[x.id]||0)}).join(", "),""];

}

  '<div class="fila"><button class="btn" data-a="nuevo">Empezar un mapa</button>'+(st.guardados.length?'<button class="btn sec" data-a="historial">Mis mapas ('+st.guardados.length+')</button>':'<button class="btn sec" data-a="historial">Ver ejemplos</button>')+'<button class="btn sec" data-a="guia">Qué mira cada parte</button></div>'+

function vGuia(){
  var secs=SECS_VSM().slice().reverse().map(function(s){
    return '<div class="tarjeta"><div class="pila" style="gap:4px"><span class="etq">'+s.cod+'</span><h3>'+s.nombre+'</h3></div>'+bloqueGuia(s.id)+'</div>';
  }).join("");
  return '<div class="pila"><div class="fila entre"><button class="btn sec" data-a="volver">Volver</button></div>'+
  '<div class="pila" style="gap:8px"><span class="etq">Referencia</span><h2>Qué mira cada parte</h2>'+
  '<p>El mapa usa el Modelo de Sistema Viable, del cibernético inglés Stafford Beer. Una organización es viable cuando puede sostenerse frente a lo que le pasa. Para eso necesita cinco funciones, más la verificación. En una asamblea, esas funciones se cumplen o fallan en cosas concretas: quién arma el orden del día, quién lleva el acta, quién habla afuera, quién paga el viaje.</p></div>'+
  '<div class="tarjeta"><h3>Cómo leer el dibujo</h3><p>Abajo, lo que la asamblea hace (S1). La banda de la izquierda es el protocolo (S2): las reglas de la deliberación. Más arriba, los recursos y la protección (S3) y la verificación (S3*). Después, lo que mira afuera (S4) y quiénes son (S5). El recuadro punteado de arriba es el espacio mayor: la coordinadora, la asamblea general o la red de asambleas.</p></div>'+
  '<div class="tarjeta"><h3>Quiénes participan</h3><p>Las barras muestran cuánta gente queda del momento de más participación, y de quienes vienen hoy cuántos están en grupos, cuántos hablaron y cuántos ocuparon un rol. Una asamblea grande donde hablan pocos y los roles circulan entre pocos tiene el riesgo serbio más documentado: la oligarquización informal, aunque el reglamento diga que todo rota.</p></div>'+
  secs+
  '<div class="tarjeta"><h3>De dónde salen las preguntas</h3><p>Entre noviembre de 2024 y 2026, los estudiantes serbios bloquearon facultades y decidieron todo en plenos abiertos, con reglas escritas por ellos mismos. Investigadores serbios estudiaron esos plenos desde adentro y desde afuera. La codificación piloto que alimenta este mapa reúne 161 pasajes de esos estudios, y el mapa usa los que hablan de protocolo, verificación, costos, voz pública y disenso.</p>'+
  '<p>Los plenos serbios no son un modelo para copiar. Funcionaron durante una emergencia, con estudiantes que podían dedicarle todo el día, y los propios participantes dudan de que la forma escale. Sirven como banco de pruebas: muestran qué reglas sostienen una asamblea grande y dónde se rompe.</p></div>'+
  '<div class="tarjeta"><h3>Tres ideas que atraviesan todo</h3>'+
  '<p><strong>La regla no alcanza: hay que medir.</strong> En Serbia la moderación rotaba por reglamento y terminó en un círculo chico. Contar cuántos hablaron y cuántos ocuparon un rol muestra si la rotación es real.</p>'+
  '<p><strong>El disenso es información.</strong> Una asamblea que expulsa al que piensa distinto pierde la capacidad de ver sus errores. En términos de Ashby, reduce su propia variedad justo cuando más la necesita.</p>'+
  '<p><strong>El costo decide quién se queda.</strong> Si participar cuesta plata, tiempo o golpes, la asamblea termina formada por quienes pueden pagarlo, y eso cambia lo que decide.</p></div></div>';
}

  var sect=mv.length?'<p class="chico">'+TXT.multiLbl+': '+mv.map(esc).join(", ")+'</p>':"";
  return '<div class="pila"><div class="fila entre"><button class="btn sec" data-a="inicio">Inicio</button>'+(d.ejemplo?'<span class="ejemplo">Ejemplo</span>':'')+'</div>'+
  '<div class="pila" style="gap:4px"><span class="etq">Mapa · '+fechaLinda(d.fecha)+(d.zona?' · '+esc(d.zona):'')+'</span><h2>'+esc(d.org)+'</h2></div>'+
  '<div class="tarjeta"><h3>'+TXT.embTit+'</h3>'+embudo(d)+sect+'</div>'+
  '<div class="tarjeta"><div class="diagrama">'+diagrama(d)+'</div><p class="chico">'+TXT.leer+'</p></div>'+
  '<div class="tarjeta"><h3>Lo que aparece</h3>'+hl+'</div>'+
  '<div class="tarjeta"><h3>Cada parte</h3><ul class="lista">'+niveles+'</ul><button class="btn sec" data-a="guia">Qué mira cada parte</button></div>'+comparacion(d)+
  '<div class="tarjeta"><h3>'+TXT.compartir+'</h3><div class="fila"><button class="btn" data-a="copiar">Copiar resumen para WhatsApp</button><button class="btn sec" data-a="imagen">Compartir imagen del mapa</button></div><p class="chico" id="msg">'+esc(st.msg)+'</p><p class="chico">La imagen se puede compartir desde la app instalada en el teléfono o abierta en la compu. Para instalarla, mirá «Instalarla en el teléfono» en el inicio.</p></div></div>';
}
function comparacion(d){
  var mismos=todos().filter(function(x){return x.org.trim().toLowerCase()===d.org.trim().toLowerCase()&&x.fecha<d.fecha}).sort(function(a,b){return a.fecha<b.fecha?1:-1});
  if(!mismos.length)return "";
  var p=mismos[0], orden={falta:0,fragil:1,firme:2};
  var filas=SECS_VSM().map(function(s){var a=nivel(p,s),b=nivel(d,s);var c=orden[b]-orden[a];
    return '<strong>'+s.cod+'</strong><span class="estado e-'+a+'">'+NOMBRE_NIVEL[a]+'</span><span><span class="estado e-'+b+'">'+NOMBRE_NIVEL[b]+'</span> '+(c>0?"↑ mejoró":c<0?"↓ empeoró":"= igual")+'</span>'}).join("");
  var nf=NUMS.map(function(x){var a=(p.n||{})[x.id]||0,b=(d.n||{})[x.id]||0;
    return '<span>'+NUM_CORTO[x.id]+'</span><span style="font-variant-numeric:tabular-nums">'+a+'</span><span style="font-variant-numeric:tabular-nums">'+b+(b>a?" ↑":b<a?" ↓":"")+'</span>'}).join("");
  return '<div class="tarjeta"><h3>Cambio desde el '+fechaLinda(p.fecha)+'</h3><div class="cmp"><span></span><span class="etq">Antes</span><span class="etq">Ahora</span>'+nf+filas+'</div></div>';
}
function vHistorial(){
  var t=todos().sort(function(a,b){return a.fecha<b.fecha?1:-1});
  var items=t.map(function(d){return '<li><span><strong>'+esc(d.org)+'</strong><br><span class="chico">'+fechaLinda(d.fecha)+(d.zona?' · '+esc(d.zona):'')+'</span> '+(d.ejemplo?'<span class="ejemplo">Ejemplo</span>':'')+'</span><button class="btn sec" data-a="ver" data-id="'+d.id+'">Abrir</button></li>'}).join("");
  var borrar=st.guardados.length?(st.confirmarBorrar?
    '<div class="tarjeta"><p><strong>¿Borrar los '+st.guardados.length+' mapas de este teléfono?</strong> No se pueden recuperar.</p><div class="fila"><button class="btn peligro" data-a="borrarSi">Sí, borrar todo</button><button class="btn sec" data-a="borrarNo">Cancelar</button></div></div>':
    '<button class="btn peligro" data-a="borrar">Borrar todo</button>'):'<p class="chico">Todavía no hay mapas propios. Estos son ejemplos para ver cómo funciona.</p>';
  return '<div class="pila"><div class="fila entre"><button class="btn sec" data-a="inicio">Inicio</button><button class="btn" data-a="nuevo">Nuevo mapa</button></div><h2>Mis mapas</h2><div class="tarjeta"><ul class="lista">'+items+'</ul></div>'+borrar+vDatos()+'</div>';
}

function actualizarSig(){var b=document.getElementById("sig");if(b&&st.actual)b.disabled=!completoPaso(st.actual,st.paso)}
function pintar(){
  var app=document.getElementById("app");
  app.innerHTML=st.vista==="paso"?vPaso():st.vista==="resultado"?vResultado():st.vista==="historial"?vHistorial():st.vista==="guia"?vGuia():vInicio();
}
document.getElementById("app").addEventListener("input",function(e){
  if(!st.actual)return;
  var el=e.target;
  if(el.id==="org")st.actual.org=el.value;
  else if(el.id==="zona")st.actual.zona=el.value;
  else if(el.getAttribute("data-n")){var v=el.value;st.actual.n[el.getAttribute("data-n")]=v===""?null:Math.max(0,parseInt(v,10)||0)}
  actualizarSig();
});

document.getElementById("app").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]"); if(!b)return;
  var a=b.getAttribute("data-a"); st.msg="";
  if(a==="nuevo"){st.actual={id:"m"+Date.now(),org:"",zona:"",fecha:hoy(),m:{},n:{},r:{}};st.paso=0;st.vista="paso"}
  else if(a==="inicio"){st.vista="inicio";st.confirmarBorrar=false}
  else if(a==="historial"){st.vista="historial"}
  else if(a==="guia"){st.volver=st.vista;st.vista="guia";pintar();window.scrollTo(0,0);return}
  else if(a==="volver"){st.vista=st.volver||"inicio";pintar();window.scrollTo(0,0);return}
  else if(a==="ver"){st.verId=b.getAttribute("data-id");st.vista="resultado"}
  else if(a==="resp"){st.actual.r[b.getAttribute("data-q")]=+b.getAttribute("data-v")}
  else if(a==="multi"){var q=b.getAttribute("data-q"),v=b.getAttribute("data-v"),arr=st.actual.m[q]||(st.actual.m[q]=[]),i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v)}
  else if(a==="atras"){if(st.paso>0)st.paso--;window.scrollTo(0,0)}
  else if(a==="sig"){
    if(st.paso<SECS.length-1)st.paso++;
    else{st.actual.org=st.actual.org.trim();st.actual.zona=(st.actual.zona||"").trim();st.guardados.push(st.actual);var ok=guardar();st.verId=st.actual.id;st.actual=null;st.vista="resultado";if(!ok)st.msg="Este navegador no deja guardar. El mapa se ve ahora pero se pierde al cerrar."}
    window.scrollTo(0,0);
  }
  else if(a==="copiar"){
    var txt=resumenTexto(buscar(st.verId));
    var fin=function(m){var el=document.getElementById("msg");if(el)el.textContent=m};
    try{navigator.clipboard.writeText(txt).then(function(){fin("Copiado. Pegalo en el grupo.")},function(){fallback(txt);fin("Seleccionado: copialo con el menú del teléfono.")})}catch(err){fallback(txt);fin("Seleccionado: copialo con el menú del teléfono.")}
    return;
  }
  else if(a==="imagen"){imagen(buscar(st.verId));return}
  else if(a==="borrar"){st.confirmarBorrar=true}
  else if(a==="borrarNo"){st.confirmarBorrar=false}
  else if(a==="borrarSi"){st.guardados=[];guardar();try{localStorage.removeItem(CLAVE)}catch(err){}st.confirmarBorrar=false}
  if(a==="resp"||a==="multi"){var y=window.scrollY;pintar();window.scrollTo(0,y)}else pintar();
});

function fallback(txt){
  var ta=document.createElement("textarea");ta.value=txt;ta.style.width="100%";ta.rows=8;ta.id="copia";
  var m=document.getElementById("msg");if(m&&!document.getElementById("copia")){m.parentNode.insertBefore(ta,m);ta.focus();ta.select()}
}
function imagen(d){
  try{
    var svg=diagrama(d), img=new Image(), url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    var nombre="mapa-"+d.org.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-"+d.fecha+".png";
    var aviso=function(t){var m=document.getElementById("msg");if(m)m.textContent=t};
    var bajar=function(c){var l=document.createElement("a");l.download=nombre;l.href=c.toDataURL("image/png");document.body.appendChild(l);l.click();l.remove();aviso("Si no se descargó, abrí la app instalada o en la compu.")};
    img.onload=function(){var c=document.createElement("canvas");c.width=img.width*2;c.height=img.height*2;var x=c.getContext("2d");x.scale(2,2);x.drawImage(img,0,0);
      c.toBlob(function(b){
        try{
          var f=b&&window.File?new File([b],nombre,{type:"image/png"}):null;
          if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
            navigator.share({files:[f],title:"Mapa de "+d.org}).then(function(){aviso("Listo.")},function(err){if(!err||err.name!=="AbortError")bajar(c)});
          }else bajar(c);
        }catch(err){bajar(c)}
      },"image/png")};
    img.src=url;
  }catch(e){var m=document.getElementById("msg");if(m)m.textContent="No se pudo generar la imagen en esta vista."}
}

try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",pintar)}catch(e){}
try{new MutationObserver(pintar).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}
pintar();
})();
</script>

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
</script>
